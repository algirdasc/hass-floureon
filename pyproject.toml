[project]
name = "hass-floureon"
version = "1.0.1"
description = "Home Assistant integration for Floureon WiFi thermostats"
requires-python = ">=3.13"
dependencies = [
    "python-broadlink==1.0.6",
    "pythoncrc",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff",
    "ty",
    "voluptuous>=0.15",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["ANN", "E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
quote-style = "preserve"

[tool.ty.environment]
python-version = "3.13"

[tool.ty.src]
include = ["custom_components", "tests"]

[tool.ty.analysis]
# Home Assistant is provided by the host; tests mock its interfaces.
allowed-unresolved-imports = ["homeassistant.**"]
